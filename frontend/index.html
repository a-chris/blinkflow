<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blinkflow — understand flows with the blink of an eye</title>
    <meta name="description" content="Understand flows with the blink of an eye. Blinkflow gives AI a standard way to explain a flow, and gives you the detail only where you ask for it." />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo">⌁</span>
          <h1>Blinkflow</h1>
          <span class="tag">understand flows</span>
        </div>
        <div class="controls">
          <label class="field">
            <span>sample</span>
            <select id="sample"></select>
          </label>
          <label class="field">
            <span>open in</span>
            <select id="open-in"></select>
          </label>
          <label class="field">
            <span>base</span>
            <input id="base" spellcheck="false" size="22" />
          </label>
          <div class="buttons">
            <button id="share" type="button" class="is-primary" title="Copy a link that opens this exact document">share</button>
            <button id="expand" type="button" title="Open every panel">expand all</button>
            <button id="collapse" type="button" title="Close every panel">collapse all</button>
          </div>
          <a
            class="icon-link"
            href="https://github.com/a-chris/blinkflow"
            target="_blank"
            rel="noopener noreferrer"
            title="Blinkflow on GitHub — source, licence and issues"
            aria-label="Blinkflow on GitHub"
          >
            <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false">
              <path
                fill="currentColor"
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"
              />
            </svg>
          </a>
        </div>
      </header>

      <main class="split" id="split">
        <section class="pane pane-editor">
          <div class="pane-head"><span>source</span><span class="pane-hint">indent = structure</span></div>
          <div class="editor-host" id="editor"></div>
        </section>
        <div class="gutter" id="gutter" role="separator" aria-orientation="vertical" aria-label="Resize panes"></div>
        <section class="pane pane-preview">
          <div class="pane-head"><span>diagram</span><span class="pane-hint">click &gt; for detail</span></div>
          <div class="preview" id="preview"></div>
        </section>
      </main>

      <footer class="status" id="status"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
